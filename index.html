<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>Encuentra tu auto · Mappedin demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" />
  </head>
  <body>
    <div id="map"></div>

    <header class="topbar">
      <div class="brand">
        <span class="logo">P</span>
        <div>
          <strong id="app-name">Find My Car</strong>
          <small id="subtitle"></small>
        </div>
      </div>
      <div class="controls">
        <select id="floor"></select>
        <button id="lang" class="lang" type="button"></button>
      </div>
    </header>

    <section class="sheet" id="sheet">
      <div class="steps" id="steps">
        <span data-step="park"></span>
        <span data-step="start"></span>
        <span data-step="go"></span>
      </div>
      <h1 id="title"></h1>
      <p id="message"></p>
      <ol id="instructions" class="instructions" hidden></ol>
      <div class="actions" id="actions"></div>
      <p class="credit" id="credit"></p>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
